name: Build Windows Installer

on:
  workflow_dispatch:
  push:
    paths:
      - "client/**"
      - "emulator/**"
      - ".github/workflows/build-windows.yml"
  pull_request:
    paths:
      - "client/**"
      - "emulator/**"
      - ".github/workflows/build-windows.yml"

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install 7zip (unpack RetroArch.7z)
        run: choco install 7zip -y
        working-directory: .

      - name: Fetch bundled RetroArch + FBNeo
        working-directory: .
        shell: bash
        run: |
          chmod +x scripts/fetch-runtime.sh
          ./scripts/fetch-runtime.sh win32-x64

      - name: Build Windows installers (NSIS + zip)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run build && npx electron-builder --win nsis zip --x64

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Youxia-Windows-${{ github.sha }}
          path: |
            client/release/Youxia-Setup-*.exe
            client/release/Youxia-Setup-*.zip
          if-no-files-found: error
          retention-days: 14
