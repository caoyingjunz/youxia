name: Build macOS Installer

on:
  workflow_dispatch:
  push:
    paths:
      - "client/**"
      - "emulator/**"
      - ".github/workflows/build-mac.yml"
  pull_request:
    paths:
      - "client/**"
      - "emulator/**"
      - ".github/workflows/build-mac.yml"

concurrency:
  group: build-mac-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Fetch bundled RetroArch + FBNeo (arm64 + x64)
        working-directory: .
        run: |
          chmod +x scripts/fetch-runtime.sh
          ./scripts/fetch-runtime.sh darwin-arm64
          ./scripts/fetch-runtime.sh darwin-x64

      - name: Build macOS installers (DMG + zip, unsigned)
        env:
          # 无 Apple Developer 证书时跳过签名，便于 CI 产出 demo 包
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        # 跳过 package.json 里的 fetch（已在上一步完成双架构）
        run: npm run build && npx electron-builder --mac dmg zip --arm64 --x64

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Youxia-macOS-${{ github.sha }}
          path: |
            client/release/Youxia-*.dmg
            client/release/Youxia-*.zip
          if-no-files-found: error
          retention-days: 14
